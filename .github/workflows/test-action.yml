name: Test Action
on:
  pull_request:
    paths: ['action.yml', '.github/test-fixtures/**', '.github/workflows/test-action.yml']

jobs:
  test-annotations:
    name: Test annotations (findings expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Copy fixture into src/ so docvet --all discovers it
      - name: Stage test fixture for discovery
        run: cp .github/test-fixtures/bad_docstrings.py src/docvet/_test_fixture.py
        shell: bash
      - uses: ./
        continue-on-error: true
        id: docvet-run
      - name: Verify non-zero exit (findings expected)
        run: test "${{ steps.docvet-run.outcome }}" = "failure"
        shell: bash

  test-selective:
    name: Test selective checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage test fixture for discovery
        run: cp .github/test-fixtures/bad_docstrings.py src/docvet/_test_fixture.py
        shell: bash
      - uses: ./
        with:
          checks: "enrichment"
        continue-on-error: true
        id: docvet-run
      - name: Verify non-zero exit (enrichment findings expected)
        run: test "${{ steps.docvet-run.outcome }}" = "failure"
        shell: bash

  test-griffe:
    name: Test griffe check runs (findings expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Proves the griffe check actually ran and faulted the fixture, and
      # that the action turns that into a non-zero exit. Three things are
      # load-bearing and must not be dropped:
      #   - checks: "griffe" below. The fixture is not griffe-only —
      #     enrichment also reports extra-param-in-docstring on it — so
      #     without this input the job would exit non-zero on enrichment
      #     alone even with griffe uninstalled, a false green.
      #   - fail-on in this repo's [tool.docvet] lists griffe, which is what
      #     turns griffe findings into exit 1. Drop griffe from fail-on and
      #     docvet exits 0 whether or not griffe is installed, so this job
      #     goes red either way and stops telling the two apart.
      #   - the griffe-unknown-param assertion. Exit code alone cannot tell
      #     "the check ran and faulted the fixture" from "docvet crashed
      #     before checking anything": both surface as outcome = failure.
      #     Only griffe produces that rule, and a crash emits no findings.
      - name: Stage griffe fixture for discovery
        run: cp .github/test-fixtures/griffe_warnings.py src/docvet/_test_fixture.py
        shell: bash
      - uses: ./
        with:
          checks: "griffe"
        continue-on-error: true
        id: docvet-run
      - name: Verify non-zero exit (griffe findings expected)
        run: test "${{ steps.docvet-run.outcome }}" = "failure"
        shell: bash
      - name: Verify the griffe check reported griffe-unknown-param
        run: |
          docvet --format json griffe --all > griffe-findings.json || true
          jq -e '.findings[] | select(.rule == "griffe-unknown-param")' griffe-findings.json
        shell: bash

  test-clean:
    name: Test clean run (zero findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # coverage check on a well-structured repo = 0 findings
      # extend-exclude is intact, so fixture is excluded
      - uses: ./
        with:
          checks: "coverage"

  test-version-pin:
    name: Test version pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          docvet-version: "1.9.0"
          checks: "coverage"
      - name: Verify installed version
        run: docvet --version | grep -q "1.9.0"
        shell: bash
      # The pinned path requests the extra too, so the griffe check must run
      # there as well. docvet 1.9.0 declares the extra as griffe>=1.0,<2,
      # which resolves to griffe 1.15.0 — the last real 1.x release, before
      # the distribution became a meta-package at 2.0.0. Same shape as
      # test-griffe, including the griffe-unknown-param assertion that a
      # crash cannot satisfy; see that job for why each piece is load-bearing.
      - name: Stage griffe fixture for discovery
        run: cp .github/test-fixtures/griffe_warnings.py src/docvet/_test_fixture.py
        shell: bash
      - uses: ./
        with:
          docvet-version: "1.9.0"
          checks: "griffe"
        continue-on-error: true
        id: docvet-griffe-run
      - name: Verify non-zero exit (griffe findings expected on the pinned path)
        run: test "${{ steps.docvet-griffe-run.outcome }}" = "failure"
        shell: bash
      - name: Verify the pinned griffe check reported griffe-unknown-param
        run: |
          docvet --format json griffe --all > griffe-findings.json || true
          jq -e '.findings[] | select(.rule == "griffe-unknown-param")' griffe-findings.json
        shell: bash

  test-python-version:
    name: Test Python version selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          python-version: "3.13"
          checks: "coverage"
      - name: Verify Python version
        run: python --version | grep -q "3.13"
        shell: bash
