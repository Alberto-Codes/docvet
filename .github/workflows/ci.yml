name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run yamllint -c .yamllint.yaml .
      # Pin the version .pre-commit-config.yaml names; the action defaults
      # to `latest`, which is exactly the drift the hook line avoids.
      - uses: raven-actions/actionlint@v2
        with:
          version: 1.7.12
      - run: uv audit --preview-features audit-command
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run ty check
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: uv run pytest --tb=short --cov=docvet --cov-report=term-missing --cov-report=xml --cov-fail-under=85
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  docvet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Alberto-Codes/docvet@v1
        id: docvet
        with:
          checks: "all"
      - name: Update docvet badge
        if: always() && github.ref == 'refs/heads/main' && vars.BADGE_GIST_ID != ''
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: docvet-badge.json
          label: docvet
          message: ${{ steps.docvet.outputs.badge_message || 'error' }}
          color: ${{ steps.docvet.outputs.badge_color || 'lightgrey' }}
