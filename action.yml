name: 'Docvet Check'
description: 'Comprehensive docstring quality checks — completeness, freshness, rendering, and coverage for Python projects'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  checks:
    description: 'Checks to run: "all" or comma-separated list (enrichment,freshness,coverage,griffe,presence)'
    required: false
    default: 'all'
  docvet-version:
    description: 'docvet version to install (use "latest" for newest)'
    required: false
    default: 'latest'
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.12'
  # Deprecated — kept for backward compatibility within v1
  version:
    description: 'docvet version to install'
    deprecationMessage: 'The "version" input is deprecated. Use "docvet-version" instead. "version" will be removed in v2.'
    required: false
    default: 'latest'
  args:
    description: 'Raw arguments passed to docvet CLI'
    deprecationMessage: 'The "args" input is deprecated. Use "checks" instead for annotation support. "args" will be removed in v2.'
    required: false
    default: ''
outputs:
  badge_message:
    description: 'Badge message for shields.io (e.g., "passing", "N findings", or "gate unavailable")'
    value: ${{ steps.run-docvet.outputs.badge_message }}
  badge_color:
    description: 'Badge color for shields.io (brightgreen, yellow, orange, or red)'
    value: ${{ steps.run-docvet.outputs.badge_color }}
  total_findings:
    description: 'Total number of findings'
    value: ${{ steps.run-docvet.outputs.total_findings }}
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install docvet
      run: |
        # Resolve version: docvet-version takes precedence over deprecated version
        DOCVET_VERSION="${{ inputs.docvet-version }}"
        if [ "$DOCVET_VERSION" = "latest" ] && [ "${{ inputs.version }}" != "latest" ]; then
          DOCVET_VERSION="${{ inputs.version }}"
        fi

        # The griffe extra is not optional: the `checks` input offers griffe
        # and defaults to "all", and docvet skips that check without a warning
        # the caller ever sees when griffe is not importable, so both paths
        # request it. What the extra resolves to depends on the version pinned:
        # 1.15.2 and later declare griffelib>=2.2,<3; 1.7.0 through 1.15.1
        # declare griffe>=1.0,<2, which lands on griffe 1.15.0, the last 1.x
        # release; 1.0.0 through 1.6.4 leave it unbounded at griffe>=1.0 and
        # so draw the griffe 2.x meta-package, which pulls griffelib in turn.
        # All three provide an importable `griffe`.
        if [ "$DOCVET_VERSION" = "latest" ]; then
          pip install "docvet[griffe]"
        else
          pip install "docvet[griffe]==$DOCVET_VERSION"
        fi
      shell: bash
    - name: Run docvet
      id: run-docvet
      run: |
        # Detect legacy mode: args is set and checks is still default
        ARGS="${{ inputs.args }}"
        CHECKS="${{ inputs.checks }}"

        if [ -n "$ARGS" ] && [ "$CHECKS" = "all" ]; then
          # Legacy mode: raw passthrough, no JSON/annotations
          docvet $ARGS
          exit $?
        fi

        # New mode: JSON output with annotations and step summary
        MERGED_OUTPUT=$(mktemp)
        STDERR_FILE=$(mktemp)

        if [ "$CHECKS" = "all" ]; then
          # Run all checks at once
          set +e
          docvet --format json check --all > "$MERGED_OUTPUT" 2>"$STDERR_FILE"
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "::error::docvet encountered an error (exit code $EXIT_CODE)"
            cat "$STDERR_FILE"
            exit "$EXIT_CODE"
          fi
        else
          # Selective checks: run each as a separate subcommand
          IFS=',' read -ra CHECK_LIST <<< "$CHECKS"
          PARTIAL_FILES=()
          PARTIAL_STDERR_FILES=()
          OVERALL_EXIT=0

          for CHECK in "${CHECK_LIST[@]}"; do
            CHECK=$(echo "$CHECK" | xargs)  # trim whitespace
            [ -z "$CHECK" ] && continue
            PARTIAL=$(mktemp)
            PARTIAL_STDERR=$(mktemp)

            set +e
            docvet --format json "$CHECK" --all > "$PARTIAL" 2>"$PARTIAL_STDERR"
            CHECK_EXIT=$?
            set -e

            if [ "$CHECK_EXIT" -gt 1 ]; then
              echo "::error::docvet ${CHECK} encountered an error (exit code $CHECK_EXIT)"
              cat "$PARTIAL_STDERR"
              exit "$CHECK_EXIT"
            fi

            if [ "$CHECK_EXIT" -eq 1 ]; then
              OVERALL_EXIT=1
            fi

            PARTIAL_FILES+=("$PARTIAL")
            PARTIAL_STDERR_FILES+=("$PARTIAL_STDERR")
          done

          # Merge JSON outputs
          if [ "${#PARTIAL_FILES[@]}" -eq 1 ]; then
            cp "${PARTIAL_FILES[0]}" "$MERGED_OUTPUT"
          else
            jq -s '{
              findings: (map(.findings) | add // []),
              summary: {
                total: (map(.summary.total) | add),
                by_category: {
                  required: (map(.summary.by_category.required) | add),
                  recommended: (map(.summary.by_category.recommended) | add)
                },
                files_checked: (map(.summary.files_checked) | max)
              },
              run: {
                unavailable_checks: (map(.run.unavailable_checks // []) | add | unique)
              }
            }' "${PARTIAL_FILES[@]}" > "$MERGED_OUTPUT"
          fi

          EXIT_CODE=$OVERALL_EXIT
        fi

        # Emit annotations (GitHub shows up to 10 warning annotations per step)
        if [ ! -s "$MERGED_OUTPUT" ]; then
          TOTAL=0
        else
          TOTAL=$(jq '.summary.total' "$MERGED_OUTPUT")
        fi

        if [ "$TOTAL" -gt 0 ]; then
          jq -r '.findings[] | "::warning file=\(.file | gsub(":";"%3A") | gsub(",";"%2C")),line=\(.line),title=\(.rule)::\(.message | gsub("%";"%25") | gsub("\n";"%0A") | gsub("\r";"%0D"))"' "$MERGED_OUTPUT"
        fi

        # Surface gates that never executed: without this, a run whose
        # configured check could not start reads as "no findings". Only
        # checks the config gates on are annotated — an unavailable
        # check nothing gates on is a routine skip. Whether that gate
        # also failed the run is docvet's call, carried as `blocking`,
        # which is set unless the project opted out of
        # fail-on-unavailable.
        UNAVAILABLE=""
        BLOCKING=""
        if [ -s "$MERGED_OUTPUT" ]; then
          UNAVAILABLE=$(jq -r '[(.run.unavailable_checks // [])[] | select(.configured_gate)][] | "\(.check): \(.reason) — remedy: \(.remedy)"' "$MERGED_OUTPUT")
          BLOCKING=$(jq -r '[(.run.unavailable_checks // [])[] | select(.blocking)] | length' "$MERGED_OUTPUT")
        fi
        if [ -n "$UNAVAILABLE" ]; then
          if [ "${BLOCKING:-0}" -gt 0 ]; then
            LEVEL="error"
          else
            LEVEL="warning"
          fi
          while IFS= read -r LINE; do
            echo "::${LEVEL}::docvet configured gate could not run — ${LINE}"
          done <<< "$UNAVAILABLE"
          if [ "${BLOCKING:-0}" -eq 0 ]; then
            echo "::${LEVEL}::this project set fail-on-unavailable = false under [tool.docvet]; drop it to fail the build when a configured check cannot run"
          fi
        fi

        # Write step summary
        {
          echo "### Docvet Findings"
          echo ""
          if [ -n "$UNAVAILABLE" ]; then
            echo "**Configured gates that could not run:**"
            echo ""
            while IFS= read -r LINE; do
              echo "- ${LINE}"
            done <<< "$UNAVAILABLE"
            echo ""
          fi
          if [ "$TOTAL" -gt 0 ]; then
            echo "Found **${TOTAL}** findings (up to 10 shown as inline annotations)."
            echo ""
            echo "| File | Line | Rule | Message | Severity |"
            echo "|------|------|------|---------|----------|"
            jq -r '.findings[] | "| `\(.file)` | \(.line) | `\(.rule)` | \(.message | gsub("\\|";"\\\\|")) | \(.severity) |"' "$MERGED_OUTPUT"
          elif [ -n "$UNAVAILABLE" ]; then
            echo "No findings from the checks that ran."
          else
            echo "No findings. All docstrings pass quality checks."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # Compute badge outputs (legacy mode exits early at line 71, so this only runs in new mode)
        BADGE_TOTAL=${TOTAL:-0}
        echo "total_findings=${BADGE_TOTAL}" >> "$GITHUB_OUTPUT"
        # A gate that could not run failed the build, so the badge must not
        # read "passing" just because that gate produced no findings. The
        # badge names the worst thing that happened without dropping what a
        # narrower badge would have shown, so a run with both an unrunnable
        # gate and findings keeps the count and the failure colour.
        if [ "${BLOCKING:-0}" -gt 0 ] && [ "$BADGE_TOTAL" -gt 0 ]; then
          echo "badge_message=${BADGE_TOTAL} findings, gate unavailable" >> "$GITHUB_OUTPUT"
          echo "badge_color=red" >> "$GITHUB_OUTPUT"
        elif [ "${BLOCKING:-0}" -gt 0 ]; then
          echo "badge_message=gate unavailable" >> "$GITHUB_OUTPUT"
          echo "badge_color=orange" >> "$GITHUB_OUTPUT"
        elif [ "$BADGE_TOTAL" -eq 0 ]; then
          echo "badge_message=passing" >> "$GITHUB_OUTPUT"
          echo "badge_color=brightgreen" >> "$GITHUB_OUTPUT"
        elif [ "$(jq '.summary.by_category.required // 0' "$MERGED_OUTPUT")" -eq 0 ]; then
          echo "badge_message=${BADGE_TOTAL} findings" >> "$GITHUB_OUTPUT"
          echo "badge_color=yellow" >> "$GITHUB_OUTPUT"
        else
          echo "badge_message=${BADGE_TOTAL} findings" >> "$GITHUB_OUTPUT"
          echo "badge_color=red" >> "$GITHUB_OUTPUT"
        fi

        # Clean up temp files
        rm -f "$MERGED_OUTPUT" "$STDERR_FILE" "${PARTIAL_FILES[@]}" "${PARTIAL_STDERR_FILES[@]}"

        # Propagate docvet exit code (non-zero when fail-on checks have findings)
        exit "$EXIT_CODE"
      shell: bash
